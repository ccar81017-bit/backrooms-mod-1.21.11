name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Generate Wrapper and Build
      run: |
        # Генерируем обертку Gradle 8.11.1, которая требуется для Fabric Loom 1.9
        gradle wrapper --gradle-version 8.11.1
        chmod +x gradlew
        ./gradlew build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Backrooms-Mod-1.21.1
        path: build/libs/*.jar
